[package]
name = "hw-stats"
version = "0.1.0"
edition = "2021"
description = "Home statistics formulas: calendar bucketing, average WPM, estimated typing time and the saved-minutes figure. Plain Rust, zero dependencies; hw-core mirrors its types for UniFFI."
publish = false

[lib]
crate-type = ["lib"]

# No dependencies, by design. The calendar math is ~60 lines of civil-date
# arithmetic (see `calendar.rs`); a date crate would be a much larger surface
# for a job this small, and the workspace release profile sets
# `panic = "abort"`, so every added dependency is another crate that can abort
# the app from one bad transcript row.
[dependencies]

# ---------------------------------------------------------------------------
# Panic-free-by-construction lints.
#
# THESE THREE ARE `clippy::restriction` LINTS. Restriction lints are
# allow-by-default and are NOT part of `clippy::all`, so the workflows' plain
# `cargo clippy --all-targets -- -D warnings` does NOT enable them: this table
# is the only thing that turns them on. Cargo `[lints]` is stable since 1.74
# (the workspace pins 1.86) and applies to EVERY target of the package, so
# `--all-targets` picks it up with no workflow edit.
#
# Unit tests live inside the lib behind `#[cfg(test)]`, and the crate root
# re-allows all three under `cfg(test)` — test code legitimately unwraps, and a
# `tests/` integration file would be a separate crate that never sees that
# attribute.
#
# Copied from `hw-releasenotes` (#284), `hw-localapi` (#289) and `hw-phonetic`
# (#283). The reason it applies here: the home view calls this on every
# transcript change, and the input is whatever the three stores hold — including
# the corrupt `duration` row that made `Int(Double.nan)` trap at
# `HomeStatsBar.swift:168`. A panic here is not a wrong number, it is the home
# view dying on launch.
# ---------------------------------------------------------------------------
[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
