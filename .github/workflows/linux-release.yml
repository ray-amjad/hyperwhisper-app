# Linux v1 release builder. Build and unsigned metadata generation have no
# external side effects. A GitHub Release is created only for a linux/v1.0.* tag
# or an explicitly approved workflow_dispatch run with publish_github=true.
# APT metadata is signed only when requested/available from the Production
# environment secret; the private key is never persisted as an artifact.
name: Linux Release

on:
  push:
    tags:
      - "linux/v1.0.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Linux 1.0 package version (for example 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      publish_github:
        description: "Create the linux/vVERSION GitHub Release and upload artifacts"
        required: true
        default: false
        type: boolean
      sign_apt:
        description: "Require signing with the Production LINUX_APT_SIGNING_KEY secret"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Optional GitHub Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  build-package-release:
    name: Build Linux release (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout release commit
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish_github }}
          DISPATCH_SIGN_APT: ${{ inputs.sign_apt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#linux/v}"
            publish="true"
            require_apt_signature="false"
          else
            version="$DISPATCH_VERSION"
            publish="$DISPATCH_PUBLISH"
            require_apt_signature="$DISPATCH_SIGN_APT"
          fi

          if [[ ! "$version" =~ ^1\.0\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Linux v1 release versions must match 1.0.x." >&2
            exit 1
          fi

          tag="linux/v${version}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "require_apt_signature=$require_apt_signature"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $version"
          echo "GitHub publishing enabled: $publish"
          echo "APT signature explicitly required: $require_apt_signature"

      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            desktop-file-utils \
            dpkg-dev \
            file \
            gnupg \
            lintian \
            shellcheck

      - name: Ensure .NET 10 SDK
        shell: bash
        run: |
          set -euo pipefail
          if command -v dotnet >/dev/null 2>&1 && dotnet --list-sdks | grep -q '^10\.'; then
            dotnet --info
            exit 0
          fi

          install_dir="${RUNNER_TEMP}/dotnet"
          installer="${RUNNER_TEMP}/dotnet-install.sh"
          curl --fail --silent --show-error --location \
            https://dot.net/v1/dotnet-install.sh --output "$installer"
          chmod 0755 "$installer"
          "$installer" --channel 10.0 --quality ga --install-dir "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Build release Rust core
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          rustup target add x86_64-unknown-linux-gnu
          cargo build \
            --manifest-path shared-core-rs/Cargo.toml \
            --locked \
            --release \
            --target x86_64-unknown-linux-gnu \
            -p hw-core

          core="shared-core-rs/target/x86_64-unknown-linux-gnu/release/libhyperwhisper_core.so"
          destination="app/linux/HyperWhisper.Linux/Resources/rust-core/linux-x64/libhyperwhisper_core.so"
          test -s "$core"
          install -Dm0755 "$core" "$destination"
          file "$core"
          if ldd "$core" | grep -q "not found"; then
            echo "The release Rust core has a missing dependency." >&2
            exit 1
          fi

      - name: Publish self-contained Avalonia application
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish \
            app/linux/HyperWhisper.Linux/HyperWhisper.Linux.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:Version="${{ steps.release.outputs.version }}" \
            --output artifacts/hyperwhisper-linux

          dotnet publish \
            tools/parakeet-engine-dotnet/parakeet-engine-dotnet.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:Version="${{ steps.release.outputs.version }}" \
            --output artifacts/hyperwhisper-linux/parakeet-engine

          test -x artifacts/hyperwhisper-linux/HyperWhisper
          test -x artifacts/hyperwhisper-linux/parakeet-engine/parakeet-engine
          test -s artifacts/hyperwhisper-linux/parakeet-engine/libsherpa-onnx-c-api.so
          test -s artifacts/hyperwhisper-linux/libhyperwhisper_core.so
          file artifacts/hyperwhisper-linux/HyperWhisper
          file artifacts/hyperwhisper-linux/parakeet-engine/parakeet-engine
          file artifacts/hyperwhisper-linux/libhyperwhisper_core.so

      - name: Build, test, and lint Debian package
        id: package
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          shellcheck \
            packaging/linux/scripts/build-deb.sh \
            packaging/linux/scripts/test-package.sh \
            packaging/linux/scripts/generate-apt-repository.sh \
            packaging/linux/scripts/test-apt-repository.sh \
            packaging/linux/debian/postinst \
            packaging/linux/debian/postrm
          desktop-file-validate packaging/linux/debian/hyperwhisper.desktop

          package_path="$(
            packaging/linux/scripts/build-deb.sh \
              --publish-dir artifacts/hyperwhisper-linux \
              --output-dir artifacts/release \
              --version "$VERSION" \
              --architecture amd64
          )"
          HYPERWHISPER_PACKAGE_VERSION="$VERSION" \
            packaging/linux/scripts/test-package.sh "$package_path"
          packaging/linux/scripts/test-apt-repository.sh "$package_path"
          lintian --fail-on warning "$package_path"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Generate static APT repository
        id: apt
        shell: bash
        env:
          APT_SIGNING_KEY: ${{ secrets.LINUX_APT_SIGNING_KEY }}
          REQUIRE_APT_SIGNATURE: ${{ steps.release.outputs.require_apt_signature }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          key_file=""
          cleanup() {
            if [[ -n "$key_file" ]]; then
              rm -f -- "$key_file"
            fi
          }
          trap cleanup EXIT

          signing_args=()
          if [[ "$REQUIRE_APT_SIGNATURE" == "true" && -z "$APT_SIGNING_KEY" ]]; then
            echo "APT signing was required, but LINUX_APT_SIGNING_KEY is unavailable." >&2
            exit 1
          fi
          if [[ -n "$APT_SIGNING_KEY" \
              && ( "$GITHUB_EVENT_NAME" == "push" || "$REQUIRE_APT_SIGNATURE" == "true" ) ]]; then
            umask 077
            key_file="${RUNNER_TEMP}/linux-apt-signing-key.asc"
            printf '%s' "$APT_SIGNING_KEY" > "$key_file"
            signing_args=(--signing-key-file "$key_file")
            echo "APT repository signing enabled."
          else
            echo "APT repository signing disabled; generating unsigned Release metadata."
          fi

          packaging/linux/scripts/generate-apt-repository.sh \
            --deb "$PACKAGE_PATH" \
            --output-dir artifacts/apt-repository \
            --suite stable \
            --codename stable \
            "${signing_args[@]}"

          if [[ ${#signing_args[@]} -gt 0 ]]; then
            test -s artifacts/apt-repository/dists/stable/InRelease
            test -s artifacts/apt-repository/dists/stable/Release.gpg
          else
            test ! -e artifacts/apt-repository/dists/stable/InRelease
            test ! -e artifacts/apt-repository/dists/stable/Release.gpg
          fi

      - name: Create checksums and repository archive
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="artifacts/release/hyperwhisper-apt-${VERSION}.tar.gz"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C artifacts/apt-repository .

          (
            cd artifacts/release
            sha256sum \
              "hyperwhisper_${VERSION}_amd64.deb" \
              "hyperwhisper-apt-${VERSION}.tar.gz" > SHA256SUMS
          )
          (
            cd artifacts/release
            sha256sum --check SHA256SUMS
          )

      - name: Publish GitHub Release artifacts
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $TAG" >&2
            exit 1
          fi

          notes="$RELEASE_NOTES"
          if [[ -z "$notes" ]]; then
            notes="HyperWhisper Linux ${VERSION} (amd64)"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HyperWhisper Linux ${VERSION}" \
            --notes "$notes" \
            "artifacts/release/hyperwhisper_${VERSION}_amd64.deb" \
            "artifacts/release/hyperwhisper-apt-${VERSION}.tar.gz" \
            artifacts/release/SHA256SUMS

      - name: Report dry-run artifacts
        if: steps.release.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Dry run complete: no GitHub Release, tag, or remote repository was changed."
          find artifacts/release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
