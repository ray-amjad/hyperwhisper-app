            $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
            if ($hash -ne $env:INNOSETUP_SHA256) { throw "Inno Setup installer SHA-256 $hash does not match the pinned $env:INNOSETUP_SHA256" }
            $proc = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Inno Setup installer exited $($proc.ExitCode)" }
            if (-not (Test-Iscc)) { throw "ISCC at $iscc did not compile a probe script after installing Inno Setup $env:INNOSETUP_VERSION" }
          }
          Write-Host "Using Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion) at $iscc"
        id: t
        continue-on-error: true
      - name: Tool runs in a later step
        if: steps.t.outcome == 'success'
        shell: pwsh
        run: $p = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; if (-not (Test-Path $p)) { throw 'no ISCC where build-release.ps1 looks' }; (Get-Item $p).VersionInfo.ProductVersion
      - name: Assert outcome
        shell: pwsh
        run: if ('${{ steps.t.outcome }}' -ne 'success') { throw "expected success, got ${{ steps.t.outcome }}" }; Write-Host 'outcome success as expected'
