  inno_image:
    name: "inno: image copy used"
    runs-on: windows-latest
    steps:
      - name: Install Inno Setup 6
        shell: pwsh
        env:
          INNOSETUP_VERSION: 6.7.1
          INNOSETUP_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $probeDir = Join-Path $env:RUNNER_TEMP 'iscc-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probeIss = Join-Path $probeDir 'probe.iss'
          Set-Content -Path $probeIss -Value @(
            '[Setup]',
            'AppName=ISCC probe',
            'AppVersion=1.0',
            'CreateAppDir=no',
            'Uninstallable=no',
            "OutputDir=$probeDir",
            'OutputBaseFilename=iscc-probe'
          )
          function Test-Iscc {
            if (-not (Test-Path $iscc)) { return $false }
            & $iscc /Q $probeIss | Out-Host
            return ($LASTEXITCODE -eq 0)
          }
          if (-not (Test-Iscc)) {
            Write-Host "No working Inno Setup 6 on the runner; installing the pinned $env:INNOSETUP_VERSION."
            $tag = 'is-' + ($env:INNOSETUP_VERSION -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNOSETUP_VERSION.exe"
            $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNOSETUP_VERSION.exe"
            for ($attempt = 1; ; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe
                break
              } catch {
                if ($attempt -ge 5) { throw "Inno Setup download failed after $attempt attempts: $_" }
                $delay = 5 * [math]::Pow(2, $attempt - 1)
                Write-Warning "Inno Setup download attempt $attempt failed: $_; retrying in $delay s"
                Start-Sleep -Seconds $delay
