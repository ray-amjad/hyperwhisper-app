            if ($hash -ne $env:AWSCLI_SHA256) { throw "AWS CLI MSI SHA-256 $hash does not match the pinned $env:AWSCLI_SHA256" }
            $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
            if ($proc.ExitCode -notin 0, 3010) { throw "AWS CLI MSI install exited $($proc.ExitCode)" }
            $bin = Join-Path $env:ProgramFiles 'Amazon\AWSCLIV2'
            $env:PATH = "$bin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $bin
          }
          $resolved = (Get-Command aws -CommandType Application | Select-Object -First 1).Source
          Write-Host "aws resolves to $resolved"
          & $resolved --version
          if ($LASTEXITCODE -ne 0) { throw "aws --version exited $LASTEXITCODE" }
        id: t
        continue-on-error: true
      - name: Tool runs in a later step
        if: steps.t.outcome == 'success'
        shell: pwsh
        run: aws --version; if ($LASTEXITCODE -ne 0) { throw 'aws not runnable' }; (Get-Command aws).Source
      - name: Assert outcome
        shell: pwsh
        run: if ('${{ steps.t.outcome }}' -ne 'success') { throw "expected success, got ${{ steps.t.outcome }}" }; Write-Host 'outcome success as expected'
