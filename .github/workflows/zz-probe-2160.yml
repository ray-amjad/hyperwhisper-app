name: zz-probe-2160
on:
  pull_request: null
permissions:
  contents: read
jobs:
  aws_image:
    name: "aws: image copy used"
    runs-on: windows-latest
    steps:
      - name: Install AWS CLI
        shell: pwsh
        env:
          AWSCLI_VERSION: 2.38.2
          AWSCLI_SHA256: af49ef7bcb88a8215d7118c82fca02cebf7c0a2c1b0900d36959e84daad2dc21
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $aws = Get-Command aws -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($aws) {
            & $aws.Source --version
            if ($LASTEXITCODE -ne 0) { $aws = $null }
          }
          if (-not $aws) {
            Write-Host "No working AWS CLI on the runner; installing the pinned $env:AWSCLI_VERSION."
            $url = "https://awscli.amazonaws.com/AWSCLIV2-$env:AWSCLI_VERSION.msi"
            $msi = Join-Path $env:RUNNER_TEMP "AWSCLIV2-$env:AWSCLI_VERSION.msi"
            for ($attempt = 1; ; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $msi
                break
              } catch {
                if ($attempt -ge 5) { throw "AWS CLI download failed after $attempt attempts: $_" }
                $delay = 5 * [math]::Pow(2, $attempt - 1)
                Write-Warning "AWS CLI download attempt $attempt failed: $_; retrying in $delay s"
                Start-Sleep -Seconds $delay
              }
            }
            $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash
            if ($hash -ne $env:AWSCLI_SHA256) { throw "AWS CLI MSI SHA-256 $hash does not match the pinned $env:AWSCLI_SHA256" }
            $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
            if ($proc.ExitCode -notin 0, 3010) { throw "AWS CLI MSI install exited $($proc.ExitCode)" }
            $bin = Join-Path $env:ProgramFiles 'Amazon\AWSCLIV2'
            $env:PATH = "$bin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $bin
          }
          $resolved = (Get-Command aws -CommandType Application | Select-Object -First 1).Source
          Write-Host "aws resolves to $resolved"
          & $resolved --version
          if ($LASTEXITCODE -ne 0) { throw "aws --version exited $LASTEXITCODE" }
        id: t
        continue-on-error: true
      - name: Tool runs in a later step
        if: steps.t.outcome == 'success'
        shell: pwsh
        run: aws --version; if ($LASTEXITCODE -ne 0) { throw 'aws not runnable' }; (Get-Command aws).Source
      - name: Assert outcome
        shell: pwsh
        run: if ('${{ steps.t.outcome }}' -ne 'success') { throw "expected success, got ${{ steps.t.outcome }}" }; Write-Host 'outcome success as expected'
  aws_fallback:
    name: "aws: image hidden -> pinned MSI"
    runs-on: windows-latest
    steps:
      - name: Hide the image copy
        shell: pwsh
        run: "$d = Join-Path $env:ProgramFiles 'Amazon\\AWSCLIV2'; if (Test-Path $d) { Rename-Item $d AWSCLIV2-hidden }; $env:PATH -split ';' | ForEach-Object { Write-Host $_ }; if (Get-Command aws -ErrorAction SilentlyContinue) { throw \"aws still on PATH: $((Get-Command aws).Source)\" }; Write-Host 'aws hidden'"
