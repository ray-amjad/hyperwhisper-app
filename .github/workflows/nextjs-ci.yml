# Pre-merge gate for the marketing and billing app (nextjs/).
#
# nextjs/ had no gate of any kind. Its only check was the production deploy
# (then Vercel, now nextjs-deploy.yml), which runs AFTER the merge —
# so a type error first surfaced as a red production deploy, and then held the website on the previous build while main
# looked green. PR #429 did exactly that: `next build` type-checks
# `nextjs/tests/**` as well as the app, a test read two catalog fields the
# CatalogFile type did not declare, and the website served the old model table
# for hours.
#
# `tsc --noEmit` is the same type check `next build` runs, so a green job here
# means the deploy's type step will pass too.
#
# `npm test` runs here too. Those tests guard the drift between
# `shared-app-classification/cloud-stt-catalog.json` and the page's copy of it
# in `lib/choosing-a-model/catalog.ts` — a drift that no other job could see,
# because the two deployables share no module system.
name: nextjs-ci

on:
  pull_request:
    paths: &ci-paths
      - 'nextjs/**'
      - 'shared-app-classification/**'
      - '.github/workflows/nextjs-ci.yml'
  push:
    branches: [main]
    # Same path filter as pull_request above, via YAML anchor (&ci-paths /
    # *ci-paths) — plain YAML alias resolution, not a GitHub Actions feature,
    # so the parser expands it before Actions ever sees the workflow. Matches
    # the pattern in cloud-ci.yml / macos-ci.yml / windows-ci.yml.
    paths: *ci-paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # `npm install`, not `npm ci`, and no dependency cache: nextjs/.gitignore
      # ignores package-lock.json, so this folder has no committed lockfile and
      # the deploy resolves versions at install time too. Adding a
      # lockfile is its own change — see the install fix in PR #136 before you
      # try.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # The Cloudflare Workers bundle (nextjs/DEPLOY-CLOUDFLARE.md). The site has
  # no per-PR preview deploys, so this is the only pre-merge proof that the
  # OpenNext build still succeeds. Same pnpm and commands as nextjs-deploy.yml;
  # no secrets: scripts/cf-build.mjs supplies build-only placeholders.
  cf-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run validate-appcasts
      - run: pnpm run cf:build
