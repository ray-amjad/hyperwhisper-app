id: fetch-without-timeout
language: typescript
severity: error
message: "Pass a `signal` to fetch() so a silent upstream cannot hang the request."
note: |
  Issue #782: the LLM post-processing calls in openai-compat-chat.ts and
  anthropic.ts called fetch() with no signal. An upstream that accepted the TCP
  connection and then sent nothing left the promise pending forever, so the
  retry-and-fallback ladder in routes/post-process.ts never ran and the handler
  held the connection until the machine was recycled.
  Bound the call: fetchWithTimeout() or fetchLLMWithTimeout() in
  src/providers/, an AbortController with a timer, or AbortSignal.timeout(ms).
  The rule only checks that the options object literal passed as fetch's
  second argument has its own `signal` key (`signal: x` or the `{ signal }`
  shorthand); options held in a variable are flagged. A signal that fires only on client
  disconnect passes it and still needs its own timer.
  Test files are exempt: a stubbed fetch never leaves the process.
files:
  - "hyperwhisper-cloud/src/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/node_modules/**"
rule:
  pattern: fetch($$$ARGS)
  not:
    # The signal must be a DIRECT property of the options object literal that
    # is fetch's second argument. No `stopBy: end`: a deep search also
    # accepted a `signal` key nested anywhere in the arguments, e.g.
    # `fetch(url, { body: JSON.stringify({ signal: 1 }) })` (review round 2).
    has:
      field: arguments
      has:
        kind: object
        nthChild: 2
        has:
          any:
            # `{ signal: controller.signal }`
            - kind: pair
              has:
                field: key
                regex: '^signal$'
            # `{ signal }` shorthand
            - kind: shorthand_property_identifier
              regex: '^signal$'
